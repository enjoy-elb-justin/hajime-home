<h2 data-uid="qFR1MFvY" data-time="1709810802029" id="index_qFR1MFvY">先代から続いている信頼感</h2><p data-uid="BTD5QFwX" data-time="1709810897472">おだやか会計事務所さんとのお付き合いは父の代からなのですが、そのころから信頼があり、地域でも評判が良いことを知っていました。事業継承の際も手厚いサポートがあり、とても心強かったです。</p><figure data-uid="XNZnxJpy" data-time="1701053841091" data-thread="" style="text-align: "><img src="https://storage.googleapis.com/studio-cms-assets/projects/brqEMjnwq4/s-920x608_v-fs_webp_9952437a-c6c1-4286-b8d6-a6d00848e753.jpg" alt="" width="" height=""><figcaption></figcaption></figure><h2 data-uid="r9eqCM_b" data-time="1709810958436" id="index_r9eqCM_b">会計業務だけではない、頼りになる存在です</h2><p data-uid="azOZzSg1" data-time="1709811016556">おだやか会計事務所さんには、会計や税務だけでなく、ビジネスのアドバイスや相続・事業継承のサポートもしていただいています。私が事業を引き継ぐ際にも、専門的なサポートをしていただき、大変たすかりました。</p><h2 data-uid="f4GTRL_i" data-time="1709811011871" id="index_f4GTRL_i"></h2><p data-uid="05SdnoLa" data-time="1709811018231"></p>
